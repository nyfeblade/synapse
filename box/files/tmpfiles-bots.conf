# secfix round 3 (ruling 1): /run/bot-x is root-owned so box can't plant a symlink where bot-display and
# display-cookie write the owner token and the xauth cookie. Comments stay on their own lines: on a `d` line
# systemd-tmpfiles reads a trailing "#..." as the argument field and warns on every provision run.
d /run/bot-x          0750 root    bots    -
d /run/bothost-vnc    0700 bothost bothost -
d /run/bots-shell     0755 root    root    -

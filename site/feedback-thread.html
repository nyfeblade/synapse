<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!--THEME-->
<title>Your feedback · Synapse</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<!--HEADER:feedback-->
<div class="wrap">
  <article class="doc fb">
    <p class="crumb">Feedback</p>
    <h1>Your feedback</h1>
    <div class="fb-done" data-sent role="status">
      <h2>Sent. Thank you.</h2>
    </div>
    <div class="fb-keep">
      <p><b>Keep this link to see replies. Anyone with it can read this thread.</b></p>
      <p class="fb-link"><code data-link></code> <button class="btn ghost sm" type="button" data-copy hidden>Copy link</button></p>
    </div>
    <noscript><p>Turn on JavaScript to see replies.</p></noscript>
    <p class="fb-error" data-error hidden></p>
    <ol class="fb-msgs" data-msgs></ol>
    <p class="fb-empty" data-empty hidden>No replies yet</p>
    <form class="fb-form" data-reply hidden>
      <label class="fb-field">
        <span>Reply</span>
        <textarea name="message" rows="4" maxlength="5000" required></textarea>
      </label>
      <p class="fb-hide" data-hide hidden></p>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </article>
</div>
<!--FOOTER-->
<script src="/assets/site.js"></script>
<script type="module" src="/assets/feedback-thread.js"></script>
</body>
</html>

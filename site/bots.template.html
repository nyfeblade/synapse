<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<!--THEME-->
<!--SEO:bots-->
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="bots">
<!--HEADER:bots-->
<!--BOTDEFS-->
<main class="wrap">
  <section class="bots" data-bots>
    <h1>Bots</h1>
    <div class="bp-pending" data-pending hidden><button class="btn primary" type="button" data-pending-add></button></div>
    <div class="bots-bar">
      <input class="bots-search" type="search" placeholder="Search" aria-label="Search Bots" autocomplete="off" data-search>
      <div class="bchips" role="group" aria-label="Tools"><!--BOTS:CHIPS--></div>
    </div>
    <div class="starters bgrid" data-grid>
<!--BOTS:CARDS-->
    </div>
    <p class="bp-line" data-none hidden>No Bots match.</p>
  </section>
</main>

<dialog class="bdialog" data-dialog aria-labelledby="bdialog-name">
  <form method="dialog" class="bdialog-top"><button class="bdialog-x" type="submit" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></form>
  <div class="bp-card" data-card>
    <p class="bp-line" data-error role="alert" hidden></p>
    <div class="bp-head">
      <div class="bp-face" data-face></div>
      <div class="bp-id">
        <h2 class="bp-name" id="bdialog-name" data-name></h2>
        <p class="bp-title" data-title></p>
      </div>
    </div>
    <div class="bp-actions">
      <button class="btn primary" type="button" data-add>Add to Synapse</button>
      <a class="btn primary" href="https://github.com/nyfeblade/synapse/releases" target="_blank" rel="noopener noreferrer" data-download hidden>Download Synapse</a>
      <button class="btn ghost" type="button" data-save>Save .botpack</button>
    </div>
    <p class="bp-note" data-copied role="status" hidden>Link copied</p>
    <p class="bp-note" data-update hidden>Nothing happened? <a href="https://github.com/nyfeblade/synapse/releases" target="_blank" rel="noopener noreferrer">Update Synapse</a></p>
    <dl class="bp-rows">
      <div data-row="tools" hidden><dt>Tools</dt><dd class="bp-chips" data-tools></dd></div>
      <div data-row="skills" hidden><dt>Skills</dt><dd data-skills></dd></div>
      <div data-row="flags" hidden><dt>Unusual text</dt><dd class="bp-chips" data-flags></dd></div>
    </dl>
    <section class="bp-section">
      <h3 class="bp-h">Instructions</h3>
      <pre class="bp-instructions" data-instructions></pre>
    </section>
  </div>
</dialog>
<!--FOOTER-->
<script type="application/json" id="bots-data"><!--BOTS:DATA--></script>
<script src="/assets/site.js"></script>
<script type="module" src="/assets/bots.js"></script>
</body>
</html>
